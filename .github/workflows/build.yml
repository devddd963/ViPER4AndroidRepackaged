name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  Build:
    name: Build Magisk Module
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Locate Android NDK
      id: ndk
      run: |
        if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
          NDK_PATH="$ANDROID_NDK_LATEST_HOME"
        elif [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
          NDK_PATH="$ANDROID_NDK_HOME"
        else
          NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
        fi
        echo "Found NDK at: $NDK_PATH"
        echo "path=$NDK_PATH" >> "$GITHUB_OUTPUT"

    - name: Build Universal 32-bit Float SIMD Bridge
      run: |
        NDK="${{ steps.ndk.outputs.path }}"
        TOOLCHAIN="$NDK/build/cmake/android.toolchain.cmake"

        echo "==> Compiling for arm64-v8a..."
        cmake -B build-arm64 -S bridge \
          -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-arm64

        echo "==> Compiling for armeabi-v7a (ARM phone driver)..."
        cmake -B build-arm -S bridge \
          -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
          -DANDROID_ABI=armeabi-v7a \
          -DANDROID_PLATFORM=android-24 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-arm

        echo "==> Compiling for x86 (Emulator driver with SSE2)..."
        cmake -B build-x86 -S bridge \
          -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
          -DANDROID_ABI=x86 \
          -DANDROID_PLATFORM=android-24 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-x86

    - name: Package Bridges into Unified Module Drivers
      run: |
        # 1. ARM Driver Setup: preserve original core and drop in ARM NEON bridge
        if [ -f magiskmodule/drivers/arm/libv4a_fx.so ] && [ ! -f magiskmodule/drivers/arm/libv4a_fx_real.so ]; then
          mv magiskmodule/drivers/arm/libv4a_fx.so magiskmodule/drivers/arm/libv4a_fx_real.so
        fi
        cp -f build-arm/libv4a_bridge.so magiskmodule/drivers/arm/libv4a_fx.so

        # 2. x86 Driver Setup: preserve original core and drop in x86 SSE2 bridge
        if [ -f magiskmodule/drivers/x86/libv4a_fx.so ] && [ ! -f magiskmodule/drivers/x86/libv4a_fx_real.so ]; then
          mv magiskmodule/drivers/x86/libv4a_fx.so magiskmodule/drivers/x86/libv4a_fx_real.so
        fi
        cp -f build-x86/libv4a_bridge.so magiskmodule/drivers/x86/libv4a_fx.so

        echo "==> Unified Drivers Prepared:"
        echo "--- ARM Drivers ---"
        ls -la magiskmodule/drivers/arm/
        echo "--- x86 Drivers ---"
        ls -la magiskmodule/drivers/x86/

    - name: Compile Unified Magisk Module
      run: |
        chmod +x compile.sh
        ./compile.sh

    - name: Upload Flashable Unified Module
      uses: actions/upload-artifact@v4
      with:
        name: ViPER4AndroidFX-Universal-Unified
        path: ViPER4AndroidFX-*.zip
        if-no-files-found: error
